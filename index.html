<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block SAm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stat-box"><span class="label">SCORE</span><span id="scoreText" class="value">0</span></div>
            <div id="fever-container"><div id="fever-bar"></div></div>
            <div class="stat-box"><span class="label">HIGH</span><span id="highText" class="value">0</span></div>
        </div>
        <canvas id="game" width="320" height="320"></canvas>
        <div id="piece-dock">
            <canvas id="p1" class="dock-cell" width="80" height="80"></canvas>
            <canvas id="p2" class="dock-cell" width="80" height="80"></canvas>
            <canvas id="p3" class="dock-cell" width="80" height="80"></canvas>
        </div>
        <div id="overlay">
            <h1>BLOCK <span style="color:#3b82f6">SAm</span></h1>
            <p style="margin-bottom: 20px; opacity: 0.8;">انقر للتدوير، اسحب للعب</p>
            <button class="btn" onclick="startGame()">إبدأ اللعب</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
    </html>
